[project]
name = "labbrain"
version = "0.2.0"
description = "Deterministic core of lab-brain: schemas, IDs, validation, lint and PHI scanning for ML research vaults"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jorgebotas" }]
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6",
    "ruamel.yaml>=0.18",
]

[project.scripts]
labbrain = "labbrain.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labbrain"]

# hatchling ignores .git/info/exclude, so name what the sdist ships: untracked
# working-tree directories (agent scratch, worktree metadata) must never be published.
[tool.hatch.build.targets.sdist]
only-include = [
    "labbrain",
    "tests",
    "docs",
    "scripts",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    ".pre-commit-hooks.yaml",
    "uv.lock",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
markers = [
    "slow: performance-budget tests",
    "network: needs network access (pre-commit try-repo)",
    "smoke: headless Claude Code runs; need claude plus ANTHROPIC_API_KEY or LABBRAIN_SMOKE_LOGIN=1",
]
addopts = ["-m", "not smoke"]

[tool.coverage.run]
source = ["labbrain"]

[tool.coverage.report]
include = [
    "*/labbrain/schema.py",
    "*/labbrain/ids.py",
    "*/labbrain/vault.py",
    "*/labbrain/phi.py",
    "*/labbrain/lint/*",
    "*/labbrain/trackers/*",
    "*/labbrain/experiments.py",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long literals (hashes) cannot wrap

[tool.uv]
# uvx --from <checkout> (how the plugin runs the engine) rebuilds only when these change.
cache-keys = [{ file = "pyproject.toml" }, { file = "labbrain/**/*.py" }]
