[project]
name = "labbrain"
dynamic = ["version"]
description = "Deterministic core of lab-brain: schemas, IDs, validation, lint and PHI scanning for ML research vaults"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jorgebotas" }]
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6",
    "ruamel.yaml>=0.18",
]

[project.scripts]
labbrain = "labbrain.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "labbrain/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["labbrain"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
markers = [
    "slow: performance-budget tests",
    "network: needs network access (pre-commit try-repo)",
]

[tool.coverage.run]
source = ["labbrain"]

[tool.coverage.report]
include = [
    "*/labbrain/schema.py",
    "*/labbrain/ids.py",
    "*/labbrain/vault.py",
    "*/labbrain/phi.py",
    "*/labbrain/lint/*",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long literals (hashes) cannot wrap
